name: ROS2 Build and Lint Checks

on: [push, pull_request]

jobs:
  lint:
    name: Ament Build & Linters
    runs-on: ubuntu-latest

    container: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ROS2 (Humble)
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ament-cmake \
            ros-humble-ament-lint-auto \
            ros-humble-ament-cmake-cppcheck \
            ros-humble-ament-cmake-lint-cmake \
            ros-humble-ament-cmake-pep257 \
            ros-humble-ament-cmake-xmllint \
            cppcheck \
            python3-pep257 \
            xmllint

      - name: Build and run lint tests
        run: |
          source /opt/ros/humble/setup.bash

          # Create a dedicated build directory for lint tests only
          mkdir -p lint_ws/src
          cp -r . lint_ws/src/$(basename $GITHUB_WORKSPACE)
          cd lint_ws

          colcon build \
            --cmake-args -DBUILD_TESTING=ON \
            --event-handlers console_cohesion+

          colcon test \
            --packages-skip kalman_filter \
            --packages-skip ros2_numpy \
            --event-handlers console_cohesion+ \
            --return-code-on-test-failure 

      - name: Show test results on failure
        if: failure()
        run: |
          cd lint_ws
          colcon test-result --all --verbose
