name: pre-commit-check

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the full history so the diff range is available
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Install Python (required by pre-commit hooks)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3) Determine the commit range to lint (works for both PRs and direct pushes)
      - name: Set git range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi

          # On a new branch / first push, skip pre-commit
          ZERO=0000000000000000000000000000000000000000
          if [[ "$FROM" == "$ZERO" ]]; then
            echo "RUN=false" >> "$GITHUB_ENV"
          else
            echo "RUN=true" >> "$GITHUB_ENV"
            echo "FROM=$FROM" >> "$GITHUB_ENV"
            echo "TO=$TO" >> "$GITHUB_ENV"
          fi

      # 4) Run pre-commit; the job fails if any file would be reformatted
      - name: Run pre-commit
        if: env.RUN == 'true'
        uses: pre-commit/action@v3.0.1  # Latest stable release as of July 2025
        with:
          extra_args: --from-ref ${{ env.FROM }} --to-ref ${{ env.TO }}
